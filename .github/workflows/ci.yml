name: CI
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  statuses: write
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'ci-placeholder-key' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test (hermetic Supabase environment)
        run: npm run test
        env:
          VITE_SUPABASE_URL: https://stock-sur-tests.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: test-public-placeholder-key
      - run: npm run build
      - name: Report required commit statuses
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const statusContext of ["CI", "ci"]) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: "success",
                context: statusContext,
                description: "CI passed",
                target_url: targetUrl
              });
            }
